name: KONLEN WF96D Temperature Controller

products:
  - id: 2j4zgjwtzm7ztytp
    manufacturer: KONLEN
    model: WF96D

entities:
  - entity: switch
    name: Timer Switch
    category: config
    dps:
      - id: 1
        name: switch
        type: boolean

  - entity: switch
    name: Manual Switch
    category: config
    dps:
      - id: 115
        name: switch
        type: boolean

  - entity: sensor
    name: Current Temperature
    class: temperature
    dps:
      - id: 3
        name: sensor
        type: integer
        unit: C
        class: measurement
        mapping:
          - scale: 10

  - entity: number
    name: Temperature ON
    class: temperature
    category: config
    dps:
      - id: 102
        name: value
        type: integer
        unit: C
        range:
          min: -400
          max: 1400
        mapping:
          - scale: 10

  - entity: number
    name: Temperature OFF
    class: temperature
    category: config
    dps:
      - id: 2
        name: value
        type: integer
        unit: C
        range:
          min: -400
          max: 1400
        mapping:
          - scale: 10

  - entity: sensor
    name: Upper Alarm
    class: temperature
    dps:
      - id: 103
        name: sensor
        type: integer
        unit: C
        mapping:
          - scale: 10

  - entity: sensor
    name: Lower Alarm
    class: temperature
    dps:
      - id: 104
        name: sensor
        type: integer
        unit: C
        mapping:
          - scale: 10

  - entity: sensor
    name: Sensor Status
    class: enum
    dps:
      - id: 101
        name: sensor
        type: string

  - entity: sensor
    name: Work Mode
    class: enum
    dps:
      - id: 114
        name: sensor
        type: string
